<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Pantry - AI Recipe & Pantry Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  :root {
    --primary: #16a34a;
    --primary-dark: #15803d;
    --primary-gradient: linear-gradient(135deg, #16a34a 0%, #0f766e 100%);
    --bg-main: #f8faf9;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-light: #e2e8f0;
    --border-subtle: #f1f5f9;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 10px 25px -5px rgba(22, 163, 74, 0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* App Header */
  header {
    background: var(--primary-gradient);
    color: #ffffff;
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 15px rgba(15, 118, 110, 0.15);
    z-index: 10;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .header-icon {
    width: 40px;
    height: 40px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .header-title {
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    font-size: 0.8rem;
    opacity: 0.9;
    font-weight: 400;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.15);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 500;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 8px #4ade80;
  }

  /* Dialogue / Chat Container */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    scroll-behavior: smooth;
  }

  .msg-row {
    display: flex;
    gap: 0.8rem;
    width: 100%;
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    justify-content: flex-end;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .msg-row.agent .avatar {
    background: #e6f4ea;
    color: var(--primary);
    border: 1px solid #c6e7ce;
  }

  .msg-row.user .avatar {
    background: var(--primary);
    color: #fff;
  }

  .message-wrapper {
    max-width: 82%;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .msg-author {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    margin-left: 0.25rem;
  }

  .msg-row.user .msg-author {
    align-self: flex-end;
    margin-right: 0.25rem;
  }

  .bubble {
    padding: 0.85rem 1.15rem;
    border-radius: 16px;
    font-size: 0.95rem;
    line-height: 1.55;
    word-break: break-word;
    box-shadow: var(--shadow-sm);
  }

  .msg-row.agent .bubble {
    background: var(--bg-card);
    color: var(--text-main);
    border: 1px solid var(--border-light);
    border-top-left-radius: 4px;
  }

  .msg-row.user .bubble {
    background: var(--primary-gradient);
    color: #ffffff;
    border-top-right-radius: 4px;
    box-shadow: var(--shadow-lg);
  }

  /* Rich A2UI Card Container */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    box-shadow: none;
    width: 100%;
  }

  /* Prompt Suggestions */
  .example-prompts {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 1.5rem;
    background: var(--bg-card);
    border-top: 1px solid var(--border-light);
    max-width: 840px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .example-prompts::-webkit-scrollbar { display: none; }

  .prompt-chip {
    background: #f1f5f9;
    color: #334155;
    border: 1px solid #cbd5e1;
    border-radius: 20px;
    padding: 0.45rem 0.95rem;
    font-size: 0.825rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .prompt-chip:hover {
    background: #e2e8f0;
    color: var(--primary-dark);
    border-color: var(--primary);
    transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }

  /* Form / Input Container */
  .input-area {
    background: var(--bg-card);
    border-top: 1px solid var(--border-subtle);
    padding: 0.85rem 1.5rem 1.25rem 1.5rem;
  }

  form {
    max-width: 840px;
    margin: 0 auto;
    display: flex;
    gap: 0.75rem;
    align-items: center;
    background: var(--bg-main);
    border: 1px solid var(--border-light);
    border-radius: 28px;
    padding: 0.35rem 0.45rem 0.35rem 1.15rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  form:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    background: #ffffff;
  }

  input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text-main);
    outline: none;
  }

  input::placeholder {
    color: #94a3b8;
  }

  button.send-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: var(--primary-gradient);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 2px 8px rgba(22, 163, 74, 0.25);
  }

  button.send-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
  }

  /* --- A2UI Component Styles --- */
  .a2card {
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 1.25rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; color: #0f172a; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; color: #1e293b; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; color: #1e293b; }
  .a2text.a2-caption { font-size: 0.825rem; color: var(--text-muted); }
  
  .a2divider { border: none; border-top: 1px solid var(--border-light); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--primary); }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-icon">🥗</div>
    <div>
      <div class="header-title">Smart Pantry Concierge</div>
      <div class="header-subtitle">AI Recipe & Inventory Assistant</div>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Agent Active</span>
  </div>
</header>

<div id="log"></div>

<div class="example-prompts">
  <button type="button" class="prompt-chip" onclick="usePrompt('What items do I have in my pantry?')">📦 Check Pantry</button>
  <button type="button" class="prompt-chip" onclick="usePrompt('Search recipes with chicken and garlic')">🍲 Find Recipes</button>
  <button type="button" class="prompt-chip" onclick="usePrompt('Find grocery stores near 1600 Amphitheatre Pkwy')">📍 Nearby Stores</button>
</div>

<div class="input-area">
  <form id="form">
    <input id="input" placeholder="Ask about recipes, pantry stock, or local markets…" autocomplete="off" autofocus>
    <button type="submit" class="send-btn" title="Send message">
      <span class="material-symbols-outlined" style="color: #fff; font-size: 1.3rem;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function usePrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function appendMessageRow(who, authorName, avatarSymbol) {
  const row = el("div", "msg-row " + who);
  
  if (who === "agent") {
    const av = el("div", "avatar", avatarSymbol);
    row.appendChild(av);
  }
  
  const wrapper = el("div", "message-wrapper");
  const author = el("div", "msg-author", authorName);
  const b = el("div", "bubble");
  
  wrapper.appendChild(author);
  wrapper.appendChild(b);
  row.appendChild(wrapper);
  
  if (who === "user") {
    const av = el("div", "avatar", avatarSymbol);
    row.appendChild(av);
  }
  
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  
  const userBubble = appendMessageRow("user", "You", "👤");
  userBubble.textContent = text;
  
  input.value = "";
  const agentBubble = appendMessageRow("agent", "Smart Pantry", "🤖");
  agentBubble.textContent = "…";
  
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(agentBubble, data.parts || []);
  } catch (e) {
    agentBubble.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
